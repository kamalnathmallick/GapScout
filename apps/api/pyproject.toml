[project]
name = "gapscout-api"
version = "0.1.0"
description = "GapScout API: map-based market intelligence"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations keep long CHECK constraint strings on one line.
"migrations/versions/*" = ["E501"]
"../../scripts/*" = ["E402", "E501"]
"scripts/*" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
